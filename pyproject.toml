[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "savegram-exporter"
version = "1.3.20"
description = "Local, auditable Telegram to TGEX exporter for Windows"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
readme = "README.md"
dependencies = [
  "Telethon==1.45.0", "cryptg==0.6.0", "PyQt5==5.15.11", "qasync==0.27.1",
  "pywin32==311; sys_platform == 'win32'", "qrcode==8.2",
]

[project.gui-scripts]
savegram-exporter = "savegram_exporter.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
